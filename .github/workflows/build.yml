name: Build  memtest_time ARM32
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK r21e
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          local-cache: true

      - name: Compile  memtest_time armeabi-v7a
        run: |
          export NDK=${{ steps.setup_ndk.outputs.ndk-path }}
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang
          $CC -O0  memtest_time.c -o  memtest_time-armeabi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name:  memtest_time-arm32
          path:  memtest_time-armeabi
